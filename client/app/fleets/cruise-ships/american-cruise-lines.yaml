title: American Cruise Lines
summary: Riverboats, paddlewheelers and small coastal ships for 90 to 180 guests, cruising American rivers and coasts.
description: American Cruise Lines sails only domestic itineraries, on the Mississippi, Columbia and Snake rivers, the Great Lakes, New England, the Southeast, Puget Sound and Alaska. Most of its ships were built at Chesapeake Shipbuilding in Salisbury, Maryland.
source:
  American Cruise Lines: https://www.americancruiselines.com/ships
cover: American Harmony
