name: mcp-registry

# Publishes server.json to the official MCP registry once the version it carries is live. ci.yml calls
# this after its deploy job succeeds on main, so a listing can never run ahead of the server: the
# registry holds metadata only (name, version, description, URL) and clients read the tool list live,
# so a listed version the server does not serve would misdescribe it. A change to server.json without
# a version bump is a no-op here, and mcp_test.go keeps the version equal to mcpVersion in the binary.
#
# Domain proof: the registry checks https://openwaters.io/.well-known/mcp-registry-auth (in the
# openwaters.io repo) for the public half of the key, and MCP_REGISTRY_KEY is the private half.
on:
  workflow_call:
  workflow_dispatch:

# Checkout only; the publish talks to the registry with its own key, never to GitHub.
permissions:
  contents: read

env:
  # Pinned release of github.com/modelcontextprotocol/registry and the sha256 of its Linux tarball from
  # that release's checksums file. Bump both together.
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish:
    # The key lives in the production environment, whose branch policy admits only main, and a manual
    # run picked from any other ref does nothing. Together they keep the key out of unreviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # One run at a time, never cancelled: a queued run finds the version already listed and stops, so
    # two runs for the same version cannot both reach the publish step.
    concurrency:
      group: mcp-registry
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: look the version up in the registry
        id: registry
        run: |
          name=$(jq -r .name server.json)
          version=$(jq -r .version server.json)
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg n "$name" '$n|@uri')/versions/$version")
          case "$code" in
            200) echo "$name $version is already listed; nothing to publish"; echo "listed=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "$name $version is not listed yet"; echo "listed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "registry answered $code"; exit 1 ;;
          esac
      # The deploy job passing is not proof the new binary is serving: ask the server itself. A
      # mismatch fails the run rather than skipping, because after a green deploy it means the deploy
      # shipped something other than this commit.
      - name: confirm the live server runs this version
        if: steps.registry.outputs.listed == 'false'
        run: |
          version=$(jq -r .version server.json)
          url=$(jq -r '.remotes[0].url' server.json)
          live=$(curl -fsS -X POST "$url" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"mcp-registry.yml","version":"0"}}}' |
            jq -r .result.serverInfo.version)
          if [ "$live" != "$version" ]; then
            echo "server.json carries $version but $url serves $live; not publishing" >&2
            exit 1
          fi
          echo "$url serves $version"
      - name: install mcp-publisher
        if: steps.registry.outputs.listed == 'false'
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          rm mcp-publisher.tar.gz
      - name: publish
        if: steps.registry.outputs.listed == 'false'
        run: |
          mcp-publisher login http --domain openwaters.io --private-key "$MCP_REGISTRY_KEY"
          mcp-publisher publish
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
