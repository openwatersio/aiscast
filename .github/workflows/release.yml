name: release

# Publishes signalk-plugin/ to npm when a signalk-plugin-v* tag is pushed, using trusted publishing over
# OIDC with provenance. There is no npm token; the workflow needs `id-token: write`.
#
# The tag has to sit on a commit that already carries that version, so a release tag always describes the
# tree it points at and the workflow never writes to the repository. Tags for other release tracks do not
# match the prefix and never reach this workflow.
on:
  push:
    tags: ["signalk-plugin-v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing
      contents: write # gh release create
    defaults:
      run:
        working-directory: signalk-plugin
    steps:
      - uses: actions/checkout@v7

      # Before anything is published, so a tag pushed at the wrong commit fails here rather than shipping a
      # version that disagrees with the tree it came from.
      - name: Check the tag against the package version
        run: |
          want="${GITHUB_REF_NAME#signalk-plugin-v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "tag $GITHUB_REF_NAME wants $want, but package.json says $have" >&2
            echo "Bump the version on main first, then tag that commit. See CONTRIBUTING.md." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm >= 11.5.1 for trusted publishing
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm publish # prepack runs the build

      # The changelog entry is the release note; it is written for the people installing the plugin. A
      # release made by hand for this tag wins, so this only guarantees one exists.
      - name: Create the GitHub release
        run: |
          version="${GITHUB_REF_NAME#signalk-plugin-v}"
          notes="$(awk -v want="## $version" '$0 == want {on = 1; next} on && /^## / {exit} on' CHANGELOG.md)"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "signalk-aiscast $version" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
