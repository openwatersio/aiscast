name: packager

# Packages closed days of the normalized archive into the lake's Iceberg tables (packager/README.md).
# Nightly it packages every closed day of the past week that is missing or has changed. By hand it
# packages a range of days, one job per day, five at a time. Day order does not matter: ais.vessels
# merges each field on its own time, and a day whose vessels commit races another's merges again.
# With replay on, each day is first rebuilt from the raw archive by the server at this commit, so a
# fix to decoding, dedupe, or staleness reaches history. With tracks_only on, each day's ais.tracks is
# rolled up again from its packaged positions. The nightly run also compacts closed months of ais.tracks.
on:
  schedule:
    # hour files upload when the next hour's traffic rotates them (~01:00), so earlier would run
    # before the day's last files exist in the bucket
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: First UTC day (YYYY-MM-DD); empty for every closed day of the past week not yet packaged
        required: false
      to:
        description: Last UTC day (YYYY-MM-DD); empty for just the first day
        required: false
      replay:
        description: Rebuild each day's normalized hours from the raw archive before packaging it
        type: boolean
        default: false
      min_hours:
        description: Refuse a day with fewer distinct hours (the archive's first day, 2026-08-20, has 8)
        default: "20"
      write:
        description: Upload replayed hours and write the lake (off is a dry run on the runner, packaged into a throwaway warehouse)
        type: boolean
        default: true
      tracks_only:
        description: Only roll each day's packaged positions up into ais.tracks again
        type: boolean
        default: false

# One run at a time, so a nightly run and a range never stack their parallel days.
concurrency:
  group: packager
  cancel-in-progress: false

jobs:
  days:
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.days.outputs.days }}
    steps:
      - id: days
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          REPLAY: ${{ inputs.replay }}
          TRACKS_ONLY: ${{ inputs.tracks_only }}
        run: |
          [ "$REPLAY" != true ] || [ "$TRACKS_ONLY" != true ] || { echo "::error::replay and tracks_only do not combine"; exit 1; }
          # an empty entry is the nightly past-week run
          if [ -z "$FROM" ]; then
            [ "$REPLAY" != true ] || { echo "::error::replay needs a from day"; exit 1; }
            [ "$TRACKS_ONLY" != true ] || { echo "::error::tracks_only needs a from day"; exit 1; }
            echo 'days=[""]' >> "$GITHUB_OUTPUT"; exit 0
          fi
          TO=${TO:-$FROM}
          for x in "$FROM" "$TO"; do
            [ "$(date -u -d "$x" +%F 2>/dev/null)" = "$x" ] || { echo "::error::$x is not a YYYY-MM-DD day"; exit 1; }
          done
          [ ! "$TO" \< "$FROM" ] || { echo "::error::to ($TO) is before from ($FROM)"; exit 1; }
          d=$FROM; days=
          while [ ! "$TO" \< "$d" ]; do
            days="$days\"$d\","; d=$(date -u -d "$d + 1 day" +%F)
          done
          echo "days=[${days%,}]" >> "$GITHUB_OUTPUT"

  # Creating or upgrading the tables is not safe to race, so it happens once, before any day.
  init:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: lake
    env:
      LAKE_CATALOG_URI: ${{ (github.event_name == 'schedule' || inputs.write) && secrets.LAKE_CATALOG_URI || '' }}
      LAKE_WAREHOUSE: ${{ secrets.LAKE_WAREHOUSE }}
      LAKE_CATALOG_TOKEN: ${{ secrets.LAKE_CATALOG_TOKEN }}
      LAKE_POSITIONS_SORT: ${{ vars.LAKE_POSITIONS_SORT }}
      LAKE_MMSI_BUCKETS: ${{ vars.LAKE_MMSI_BUCKETS }}
      LAKE_ROW_GROUP_ROWS: ${{ vars.LAKE_ROW_GROUP_ROWS }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv run --script packager/packager.py --init

  package:
    needs: [days, init]
    # the lake environment only releases its secrets to main as well; this makes the reason plain
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: lake
    strategy:
      # five runners at a time; a failed day does not stop the others, so rerun just the days that failed
      max-parallel: 5
      fail-fast: false
      matrix:
        day: ${{ fromJSON(needs.days.outputs.days) }}
    name: ${{ inputs.replay && 'rebuild' || inputs.tracks_only && 'tracks' || 'package' }} ${{ matrix.day || 'past week' }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      NORMALIZED_BUCKET: ais-archive
      # A day's staging database runs to tens of GB (42 GB for 2026-09-28); the runner has about 80 GB free.
      PACKAGER_HOME: /mnt/packager
      # The runner does nothing else: 4 threads and 10 GB of the runner's 16 GB, where a full day
      # peaks near 13 GB resident with the Arrow copies of each write pass.
      PACKAGER_THREADS: 4
      PACKAGER_MEMORY: 10GB
      # the warehouse's layout (packager/README.md); unset means the packager's defaults
      LAKE_POSITIONS_SORT: ${{ vars.LAKE_POSITIONS_SORT }}
      LAKE_MMSI_BUCKETS: ${{ vars.LAKE_MMSI_BUCKETS }}
      LAKE_ROW_GROUP_ROWS: ${{ vars.LAKE_ROW_GROUP_ROWS }}
      DAY: ${{ matrix.day }}
      MIN_HOURS: ${{ inputs.min_hours || '20' }}
      WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: sudo mkdir -p /mnt/work "$PACKAGER_HOME" && sudo chown "$USER" /mnt/work "$PACKAGER_HOME"
      - if: inputs.replay
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Replay
        if: inputs.replay
        env:
          STATION_SALT: ${{ secrets.STATION_SALT }} # the live salt, so UDP station ids come out the same
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the checksums newer AWS CLIs send by default
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          s3() { aws s3 --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors "$@"; }
          dir=$(date -u -d "$DAY" +%Y/%m/%d); prev=$(date -u -d "$DAY - 1 day" +%Y/%m/%d); next=$(date -u -d "$DAY + 1 day" +%F)
          # Without the live salt the server makes up a random one, and UDP station ids would not match.
          [ -n "$STATION_SALT" ] || { echo "::error::the lake environment has no STATION_SALT"; exit 1; }
          # The live server keeps each uploaded hour on disk for two hours, and its hourly sweep uploads
          # it again if the bucket's copy is smaller, which would put the live hour back over a replayed
          # one. A full day after the day ends, every local file for it has been swept away.
          [ "$(date -u +%s)" -ge "$(date -u -d "$next + 1 day" +%s)" ] || { echo "::error::$DAY ended less than a day ago"; exit 1; }
          (cd server && go build -o /mnt/work/aiscast .)
          # the day's raw hours, and the whole previous day for replay's lead-in (90 minutes, but it is
          # the server's constant to change, and a short lead-in would silently weaken the replay)
          s3 sync "s3://$NORMALIZED_BUCKET" /mnt/work/raw --exclude "*" --include "*/$dir/*.gz" \
            --include "*/$prev/*.gz" --exclude "normalized/*"
          /mnt/work/aiscast replay -archive /mnt/work/raw -out /mnt/work/rep -from "$DAY" -to "$next"
          rm -rf /mnt/work/raw
          # What the rebuild changes, against the hours the bucket holds now. Two sample hours, a night
          # and a day: the whole day costs twice what the replay does, and the samples show the change.
          for h in 00 12; do
            mkdir -p "/mnt/work/current/normalized/v1/$dir" "/mnt/work/sample/normalized/v1/$dir"
            s3 cp "s3://$NORMALIZED_BUCKET/normalized/v1/$dir/$h.gz" "/mnt/work/current/normalized/v1/$dir/$h.gz" || true
            cp "/mnt/work/rep/normalized/v1/$dir/$h.gz" "/mnt/work/sample/normalized/v1/$dir/" || true
          done
          # normdiff exits 1 on any difference, which a rebuild expects; the report is for reading
          /mnt/work/aiscast normdiff -live /mnt/work/current -replay /mnt/work/sample > /tmp/normdiff.txt 2>&1 || true
          grep -q "^live:" /tmp/normdiff.txt || echo "::warning::normdiff produced no report: $(tail -1 /tmp/normdiff.txt)"
          { echo "### $DAY, hours 00 and 12"; echo '```'
            grep -E "^(live|replay|first|multipart|transmissions|copies|weather)" /tmp/normdiff.txt || true
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf /mnt/work/current /mnt/work/sample
          if [ "$WRITE" = true ]; then
            s3 cp "/mnt/work/rep/normalized/v1/$dir/" "s3://$NORMALIZED_BUCKET/normalized/v1/$dir/" --recursive
            rm -rf /mnt/work/rep
          fi
      - name: Package
        env:
          LAKE_CATALOG_URI: ${{ (github.event_name == 'schedule' || inputs.write) && secrets.LAKE_CATALOG_URI || '' }}
          LAKE_WAREHOUSE: ${{ secrets.LAKE_WAREHOUSE }}
          LAKE_CATALOG_TOKEN: ${{ secrets.LAKE_CATALOG_TOKEN }}
          # a dry-run replay packages its own output; everything else reads the bucket
          LOCAL: ${{ inputs.replay && !inputs.write && '/mnt/work/rep' || '' }}
          TRACKS_ONLY: ${{ inputs.tracks_only && '1' || '' }}
        run: |
          # sample the staging directory and free memory every 30 s so the run reports its peaks
          (while sleep 30; do echo "$(du -sm "$PACKAGER_HOME" | cut -f1) $(free -m | awk '/Mem:/{print $7}')"; done) > /tmp/usage.log &
          /usr/bin/time -v uv run --script packager/packager.py ${DAY:+--date "$DAY"} ${LOCAL:+--normalized "$LOCAL"} \
            ${TRACKS_ONLY:+--tracks-only} --min-hours "$MIN_HOURS" 2> >(tee /tmp/time.log >&2)
      - name: Usage
        if: always()
        run: |
          grep -E "Elapsed|Maximum resident" /tmp/time.log || true
          sort -n /tmp/usage.log | tail -1 | awk '{print "peak staging: " $1 " MB"}' || true
          sort -k2 -n /tmp/usage.log | head -1 | awk '{print "lowest available memory: " $2 " MB"}' || true
          df -h /mnt | tail -1
