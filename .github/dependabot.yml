version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        # The tide widget comes as its own PR, so a release that changes its markup, styles or
        # requests is looked at in a browser on its own, beyond the e2e checks of one station.
        exclude-patterns: ["@slackwater/*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: monthly
    groups:
      gomod:
        patterns: ["*"]
        update-types: ["minor", "patch"]
