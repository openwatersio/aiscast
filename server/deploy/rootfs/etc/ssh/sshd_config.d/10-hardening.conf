# Key-only ssh. The box gets continuous root-password brute force; with sshd defaults
# those attempts fill the pre-auth slots and randomly drop real connections, including CI deploys.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
MaxStartups 50:30:200
PerSourceMaxStartups 3
LoginGraceTime 20
# Root keeps its own file; the ops user's keys are managed here (authorized_keys.d/ops).
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
# ops gets the pprof tunnel and nothing else, whatever its keys' options say. Last in this file:
# a Match block runs to the end of the file it's in.
Match User ops
	AllowTcpForwarding local
	PermitListen none
	PermitOpen 127.0.0.1:6060
	AllowAgentForwarding no
	X11Forwarding no
	PermitTTY no
