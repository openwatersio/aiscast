# The live server comes first: ClickHouse gets half its CPU share under contention, and a hard memory
# ceiling above its own 4 GB limit, so the kernel kills ClickHouse rather than aiscast if it runs over.
[Service]
CPUWeight=50
MemoryMax=5G
# The R2 keys for the cold volume and backups (clickhouse-r2.xml); absent until a box is given them.
EnvironmentFile=-/etc/clickhouse-server/r2.env
