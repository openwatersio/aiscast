# Alert rules for the aiscast box, in Prometheus rule format. push.sh imports them into Grafana Cloud as
# Grafana-managed rules in the "aiscast" folder, routed to the aiscast email contact point. The folder
# comes from `namespace`, which mimirtool reads and promtool does not, so check with:
#   grep -v '^namespace:' rules.yaml | promtool check rules
# Outside-in availability is Upptime's /health check, not a rule here.
namespace: aiscast
groups:
  - name: aiscast
    interval: 1m
    rules:
      # Capacity. Plan on 4 vCPU of sustained use on the shared 8 vCPU box.
      - alert: AiscastCPUHigh
        expr: sum(rate(process_cpu_seconds_total{job="aiscast"}[30m])) > 2
        labels: {severity: warning}
        annotations:
          summary: aiscast is using {{ $value | printf "%.1f" }} vCPU over 30 minutes
          description: Capacity is getting tight. Start planning a bigger box.
      - alert: AiscastCPUCritical
        expr: sum(rate(process_cpu_seconds_total{job="aiscast"}[30m])) > 4
        labels: {severity: critical}
        annotations:
          summary: aiscast is using {{ $value | printf "%.1f" }} vCPU over 30 minutes
          description: The box is at its sustained CPU line. Resize this week or shed load.

      # A deploy that regresses fan-out cost shows up as more CPU per open stream than yesterday's average.
      # The baseline spans all of yesterday so one quiet hour (restarts, a lull in ingest) cannot trip it.
      # With no streams there is nothing to divide by, and the > 0 filter leaves the rule empty rather than +Inf.
      - alert: AiscastCPUPerStreamRegressed
        expr: |
          (sum(rate(process_cpu_seconds_total{job="aiscast"}[1h])) / (avg_over_time(sum(aiscast_streams{protocol!="mqtt"})[1h:5m]) > 0))
          > 1.5 * (sum(rate(process_cpu_seconds_total{job="aiscast"}[1d] offset 1d)) / avg_over_time(sum(aiscast_streams{protocol!="mqtt"})[1d:5m] offset 1d))
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: CPU per stream is more than 50% above yesterday's average
          description: A deploy may have regressed fan-out cost. Compare with the last deploy time and revert.

      - alert: HostCPUStealHigh
        expr: avg(rate(node_cpu_seconds_total{mode="steal"}[1h])) > 0.05
        labels: {severity: warning}
        annotations:
          summary: CPU steal is {{ $value | humanizePercentage }} over the last hour
          description: The shared host is contended. Consider a dedicated server type.
      - alert: HostCPUStealCritical
        expr: avg(rate(node_cpu_seconds_total{mode="steal"}[1h])) > 0.15
        labels: {severity: critical}
        annotations:
          summary: CPU steal is {{ $value | humanizePercentage }} over the last hour
          description: The shared host is badly contended. Move to a dedicated server type.

      - alert: AiscastMemoryHigh
        expr: process_resident_memory_bytes{job="aiscast"} > 4e9
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: aiscast RSS is {{ $value | humanize1024 }}B
          description: A leak or a connection flood. Check streams by tier.
      - alert: AiscastMemoryCritical
        expr: process_resident_memory_bytes{job="aiscast"} > 8e9
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: aiscast RSS is {{ $value | humanize1024 }}B
          description: A leak or a connection flood. Check streams by tier.

      # MQTT sockets only publish, so they carry no fan-out cost.
      - alert: AiscastStreamsHigh
        expr: sum(aiscast_streams{protocol!="mqtt"}) > 600
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: '{{ $value }} open streams'
          description: Approaching the fan-out CPU ceiling for this box.
      - alert: AiscastStreamsCritical
        expr: sum(aiscast_streams{protocol!="mqtt"}) > 900
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: '{{ $value }} open streams'
          description: At the fan-out CPU ceiling for this box.

      - alert: VesselsLatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(aiscast_http_request_duration_seconds_bucket{route="/v1/vessels"}[5m]))) > 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: /v1/vessels p99 is {{ $value | humanizeDuration }}
          description: Scan cost or read-lock contention with the vessel writer.
      - alert: VesselsLatencyCritical
        expr: histogram_quantile(0.99, sum by (le) (rate(aiscast_http_request_duration_seconds_bucket{route="/v1/vessels"}[5m]))) > 0.5
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: /v1/vessels p99 is {{ $value | humanizeDuration }}
          description: Scan cost or read-lock contention with the vessel writer.
      - alert: TilesLatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(aiscast_http_request_duration_seconds_bucket{route="/v1/vessels/tiles/{z}/{x}/{y}"}[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Vector tile p99 is {{ $value | humanizeDuration }}
          description: Low-zoom tiles reading the vessel record, or builds queued behind the build limit. Tile builds share the record with /v1/vessels, so its latency follows. The access log in R2 names the tiles and clients.
      - alert: TilesLatencyCritical
        expr: histogram_quantile(0.99, sum by (le) (rate(aiscast_http_request_duration_seconds_bucket{route="/v1/vessels/tiles/{z}/{x}/{y}"}[5m]))) > 2.5
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: Vector tile p99 is {{ $value | humanizeDuration }}
          description: Low-zoom tiles reading the vessel record, or builds queued behind the build limit. Tile builds share the record with /v1/vessels, so its latency follows. The access log in R2 names the tiles and clients.

      - alert: VesselsRequestRateHigh
        expr: sum(rate(aiscast_http_requests_total{route="/v1/vessels"}[5m])) > 30
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: /v1/vessels is serving {{ $value | printf "%.0f" }} requests per second
          description: Pollers. Identify the addresses in the Caddy log. A customer belongs on a stream; an abuser gets revoked.

      - alert: RateLimitedHigh
        expr: sum(rate(aiscast_ratelimited_total[5m])) > 5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: '{{ $value | printf "%.1f" }} rate-limited requests per second'
          description: Someone is hammering the API. Identify the addresses in the Caddy log.

      # /health and Upptime cover total silence; these catch the big sources going away.
      - alert: EventRateLow
        expr: sum(rate(aiscast_events_total[3m])) < 150
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: '{{ $value | printf "%.0f" }} events per second'
          description: A pipeline stall, or the big sources are gone. Check the source ages.
      - alert: EventRateCritical
        expr: sum(rate(aiscast_events_total[3m])) < 50
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: '{{ $value | printf "%.0f" }} events per second'
          description: A pipeline stall, or the big sources are gone. Check the source ages.

      - alert: UpstreamSilent
        expr: aiscast_source_last_age_seconds{source=~"kystverket|digitraffic|barentswatch"} > 300
        labels: {severity: warning}
        annotations:
          summary: No events from {{ $labels.source }} for {{ $value | humanizeDuration }}
          description: Upstream outage. Check the reconnect lines in journalctl -u aiscast.
      - alert: AISHubSilent
        expr: aiscast_source_last_age_seconds{source="aishub"} > 600
        labels: {severity: warning}
        annotations:
          summary: No events from AISHub for {{ $value | humanizeDuration }}
          description: AISHub is down or the credentials expired.

      - alert: VesselsCachedLow
        expr: aiscast_vessels < 30000
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: '{{ $value }} vessels cached'
          description: Upstream sources are missing. Check the source ages.

      - alert: ClientDropsHigh
        expr: sum(rate(aiscast_client_drops_total[5m])) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: '{{ $value | printf "%.1f" }} client queue drops per second'
          description: Slow clients or fan-out saturation. The writers cannot keep up.

      - alert: PingTimeoutsHigh
        expr: sum(rate(aiscast_ping_timeouts_total[5m])) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: '{{ $value | printf "%.1f" }} ping timeouts per second'
          description: Network trouble, or a client library that never answers pings.

      # 20 TB a month is included; each TB over costs €1.
      - alert: EgressHigh
        expr: sum(rate(node_network_transmit_bytes_total{device!="lo"}[24h])) > 4e6
        labels: {severity: warning}
        annotations:
          summary: Egress averaged {{ $value | humanize }}B/s over 24 hours
          description: A 10 TB a month pace.
      - alert: EgressCritical
        expr: sum(rate(node_network_transmit_bytes_total{device!="lo"}[24h])) > 7e6
        labels: {severity: critical}
        annotations:
          summary: Egress averaged {{ $value | humanize }}B/s over 24 hours
          description: The pace of the 20 TB a month included traffic. Time to add relays.

      - alert: ArchiveStagedHigh
        expr: aiscast_archive_staged_bytes > 5e9
        labels: {severity: warning}
        annotations:
          summary: '{{ $value | humanize1024 }}B of archive waiting on disk'
          description: R2 uploads are failing. Check the credentials and the archive sweep lines in journalctl -u aiscast.

      # The vessel record answers lookups past the cache's 30 minutes.
      - alert: StoreDown
        expr: aiscast_store_up == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: aiscast is running without the vessel record
          description: Lookups past 30 minutes and search fail. Check the store lines in journalctl -u aiscast and the file aiscast.db in /var/lib/aiscast.
      - alert: StoreWritesFailing
        expr: increase(aiscast_store_flush_failures_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: '{{ $value | printf "%.0f" }} vessel record writes failed in 10 minutes'
          description: The record is falling behind the cache. Check the store lines in journalctl -u aiscast and free disk.
      - alert: StoreMirrorFailing
        expr: increase(aiscast_store_mirror_failures_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: '{{ $value | printf "%.0f" }} record mirror refreshes failed in 10 minutes'
          description: Lookups, areas, and tiles answer from the mirror, which lags the record for the vessels those writes held until a refresh succeeds; each refresh retries them. Check the record mirror lines in journalctl -u aiscast. A restart reloads it.
      # The writer runs once a second, so the rate of its seconds is the share of each second it spends writing.
      - alert: StoreWritesSlow
        expr: rate(aiscast_store_flush_seconds_total[15m]) > 0.5
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Vessel record writes take {{ $value | humanizePercentage }} of each second
          description: The writer is near its budget. Check disk latency and the record's size on the capacity dashboard.
      # Tracks read from ClickHouse, and every accepted position is written there.
      - alert: ClickHouseDown
        expr: aiscast_clickhouse_up == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: aiscast is not writing to ClickHouse
          description: Tracks have gaps, and track requests may fail. Check the clickhouse lines in journalctl -u aiscast and systemctl status clickhouse-server.
      # A stalled ClickHouse shows as failures, then as drops once the queue is full.
      - alert: ClickHouseWritesFailing
        expr: increase(aiscast_clickhouse_write_failures_total[10m]) > 0 or increase(aiscast_clickhouse_points_dropped_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: ClickHouse is failing writes or dropping positions
          description: Tracks have gaps. Check the clickhouse lines in journalctl -u aiscast, journalctl -u clickhouse-server, and free disk.
      - alert: ImportStale
        # The import runs daily. The timestamp is absent until the first import succeeds, and every import metric is
        # absent on a server without ClickHouse, which the runs counter tells apart.
        expr: time() - aiscast_import_last_success_timestamp_seconds > 2 * 86400 or (absent(aiscast_import_last_success_timestamp_seconds) and on() aiscast_import_runs_total)
        for: 6h
        labels: {severity: warning}
        annotations:
          summary: Vessel history has not merged into the record from ClickHouse for two days
          description: New history is not reaching vessel lookups or first_seen. Check the import lines in journalctl -u aiscast and that ClickHouse is up.
      - alert: HistoryArchiveStale
        expr: time() - aiscast_history_latest_day_timestamp_seconds{source="marinecadastre"} > 150 * 86400 or increase(aiscast_history_files_total{result="failed"}[1d]) > 3 or increase(aiscast_history_check_failures_total[1d]) > 2
        for: 6h
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.source }} history is behind or failing to load'
          description: MarineCadastre publishes a quarter about two months after it closes, so its newest day loaded should never be five months old, and neither files nor the checks every six hours, which list the archive, should keep failing. The newest day reads 0 until one loads. Check the history lines in journalctl -u aiscast and history_loads in ClickHouse.
      - alert: ClickHouseWritesSlow
        expr: rate(aiscast_clickhouse_write_seconds_total[15m]) > 0.5
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: ClickHouse writes take {{ $value | humanizePercentage }} of each second
          description: The writer is near its budget. Check ClickHouse's CPU and disk latency.
      # ClickHouse's own health, from its metrics endpoint: refused inserts, too many parts, and stuck mutations
      # are how history stops being kept, and they show here before the writer's alerts fire.
      - alert: ClickHouseRejectingInserts
        expr: increase(ClickHouseProfileEvents_RejectedInserts[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: ClickHouse refused {{ $value | printf "%.0f" }} inserts for too many parts in 10 minutes
          description: Merges are not keeping up, often during a bulk load. The writer retries a refused batch for 10 minutes, then drops it. Check SELECT table, partition, count() FROM system.parts WHERE active GROUP BY ALL ORDER BY 3 DESC LIMIT 10, and pause any load.
      - alert: ClickHouseTooManyParts
        expr: ClickHouseAsyncMetrics_MaxPartCountForPartition > 100
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: A ClickHouse partition has {{ $value | printf "%.0f" }} parts
          description: Inserts arrive in more pieces than merges combine, and by default ClickHouse slows inserts at 1,000 parts and refuses them at 3,000. Check system.parts for the partition and system.merges for progress, and pause any load.
      - alert: ClickHouseMutationStuck
        expr: ClickHouseMetrics_PartMutation > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: A ClickHouse mutation has run for over an hour
          description: An ALTER ... DELETE or UPDATE is rewriting parts, and holds merges on them while it does. Check SELECT * FROM system.mutations WHERE NOT is_done, and KILL MUTATION if it is not meant to run.
      - alert: ClickHouseGrowingFast
        expr: delta(ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTables[1d]) > 3e9
        labels: {severity: warning}
        annotations:
          summary: ClickHouse grew {{ $value | humanize1024 }}B in a day
          description: Live history adds about 1 GB a day, and ClickHouse shares the root disk with the archive staging and the vessel record. Expected during an archive load; otherwise check bytes per table in system.parts.

      - alert: DiskFreeLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: '{{ $value | humanizePercentage }} of the root disk is free'
          description: An archive backlog, ClickHouse growth, or the journal cap slipped.
      - alert: DiskFreeCritical
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.1
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: '{{ $value | humanizePercentage }} of the root disk is free'
          description: An archive backlog, ClickHouse growth, or the journal cap slipped.
      # ClickHouse grows every day on the same disk, so the trend warns weeks before the free share does.
      - alert: DiskFillsSoon
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[3d], 14 * 86400) < 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: At the last three days' rate the root disk fills within two weeks
          description: ClickHouse is the usual cause. Check its size per table in system.parts, drop tables nothing reads, and move older history to cold storage, or add a volume.

      # systemd counts only the restarts it makes because a process exited on its own (Restart=always after
      # a crash, panic, or OOM kill). Deploys and manual restarts go through systemctl and never count.
      - alert: ServiceCrashed
        expr: increase(node_systemd_service_restart_total{name=~"(aiscast|caddy|alloy|clickhouse-server)\\.service"}[10m]) > 0
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.name }} crashed and systemd restarted it'
          description: The process exited on its own (a panic, a fatal error, or an out-of-memory kill), so this is not a deploy or a systemctl restart. Run journalctl -u {{ $labels.name }} -n 100 on the box to see why it exited.
      # A backstop that does not depend on the systemd collector: starts that no deploy explains, per host.
      # Each deploy brings a new aiscast_build_info revision, so the distinct revisions a host reported in
      # the hour, less the one already running, are its deploys. Revisions are counted, not whole series, so
      # a new go_version on the same revision is not a deploy. changes() sees only starts that lived to a scrape, so a fast crash loop
      # counts low here; it also stops the scrapes, which MetricsMissing catches, and ServiceCrashed counts
      # every automatic restart exactly.
      - alert: AiscastRestartStorm
        expr: |
          sum by (host) (changes(process_start_time_seconds{job="aiscast"}[1h]))
            - (count by (host) (count by (host, revision) (count_over_time(aiscast_build_info[1h]))) - 1)
          > 2
        labels: {severity: warning}
        annotations:
          summary: aiscast on {{ $labels.host }} started {{ $value }} times in the last hour without a deploy
          description: Deploys are already subtracted, so these are crashes or manual restarts. Check journalctl -u aiscast on the box, and whether someone ran systemctl restart.
      - alert: CrashDetectionMissing
        expr: absent(node_systemd_service_restart_total{name="aiscast.service"})
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: The systemd restart counter for aiscast is missing
          description: Without this counter, ServiceCrashed cannot fire and crashes go unreported. Check that Alloy is running and that its systemd collector can reach D-Bus, with systemctl status alloy and journalctl -u alloy on the box.

      # Vessel enrichment. The weekly syncs retry hourly after a failure, so a stale last-success or a
      # day of failures means every retry is failing; the FCC sync once failed for hours on a read-only
      # /tmp, which is the class of failure these exist to surface. The last-success metric appears
      # after a source's first success, so a fresh record file is covered by the failures rules.
      # A source turned off by its env flag stops exporting last-success, so these stay quiet for it.
      - alert: EnrichmentSyncStaleWikidata
        expr: time() - aiscast_wikidata_last_success_timestamp_seconds > 8 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: The Wikidata sync has not succeeded in 8 days
          description: Every hourly retry for a day or more has failed. journalctl -u aiscast | grep 'wikidata:' on the box for the error.
      - alert: EnrichmentSyncFailingWikidata
        expr: increase(aiscast_wikidata_sync_failures_total[26h]) >= 20
        labels: {severity: warning}
        annotations:
          summary: The Wikidata sync failed {{ $value | printf "%.0f" }} times in a day
          description: Nearly every hourly retry is failing, including on a record file where it has never succeeded. journalctl -u aiscast | grep 'wikidata:' on the box for the error.
      - alert: EnrichmentSyncStalePSIX
        expr: time() - aiscast_uscg_last_success_timestamp_seconds > 8 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: The PSIX sync has not succeeded in 8 days
          description: Every hourly retry for a day or more has failed. journalctl -u aiscast | grep 'uscg:' on the box for the error.
      - alert: EnrichmentSyncFailingPSIX
        expr: increase(aiscast_uscg_sync_failures_total[26h]) >= 20
        labels: {severity: warning}
        annotations:
          summary: The PSIX sync failed {{ $value | printf "%.0f" }} times in a day
          description: Nearly every hourly retry is failing, including on a record file where it has never succeeded. journalctl -u aiscast | grep 'uscg:' on the box for the error.
      - alert: EnrichmentSyncStaleFiskeridirektoratet
        expr: time() - aiscast_fiskeridir_last_success_timestamp_seconds > 8 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: The Fiskeridirektoratet sync has not succeeded in 8 days
          description: Every hourly retry for a day or more has failed. journalctl -u aiscast | grep 'fiskeridir:' on the box for the error.
      - alert: EnrichmentSyncFailingFiskeridirektoratet
        expr: increase(aiscast_fiskeridir_sync_failures_total[26h]) >= 20
        labels: {severity: warning}
        annotations:
          summary: The Fiskeridirektoratet sync failed {{ $value | printf "%.0f" }} times in a day
          description: Nearly every hourly retry is failing, including on a record file where it has never succeeded. journalctl -u aiscast | grep 'fiskeridir:' on the box for the error.
      - alert: EnrichmentSyncStaleFCC
        expr: time() - aiscast_fcc_last_success_timestamp_seconds > 8 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: The FCC sync has not succeeded in 8 days
          description: Every hourly retry for a day or more has failed. journalctl -u aiscast | grep 'fcc:' on the box for the error.
      - alert: EnrichmentSyncFailingFCC
        expr: increase(aiscast_fcc_sync_failures_total[26h]) >= 20
        labels: {severity: warning}
        annotations:
          summary: The FCC sync failed {{ $value | printf "%.0f" }} times in a day
          description: Nearly every hourly retry is failing, including on a record file where it has never succeeded. journalctl -u aiscast | grep 'fcc:' on the box for the error.
      - alert: EnrichmentSyncStaleTransportCanada
        expr: time() - aiscast_tc_last_success_timestamp_seconds > 8 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: The Transport Canada sync has not succeeded in 8 days
          description: Every hourly retry for a day or more has failed. journalctl -u aiscast | grep 'tc:' on the box for the error.
      - alert: EnrichmentSyncFailingTransportCanada
        expr: increase(aiscast_tc_sync_failures_total[26h]) >= 20
        labels: {severity: warning}
        annotations:
          summary: The Transport Canada sync failed {{ $value | printf "%.0f" }} times in a day
          description: Nearly every hourly retry is failing, including on a record file where it has never succeeded. journalctl -u aiscast | grep 'tc:' on the box for the error.

      # The ISED rounds ask per vessel, so a chronically unmatchable vessel fails a few asks a day
      # without harm; the alert is the registry failing while nothing gets through at all.
      - alert: ISEDRoundsStalled
        expr: increase(aiscast_ised_checked_total[2d]) == 0 and increase(aiscast_ised_check_failures_total[2d]) > 0
        labels: {severity: warning}
        annotations:
          summary: ISED rounds are failing and no vessel has been checked in two days
          description: The registry endpoint is refusing every ask. journalctl -u aiscast | grep 'ised:' on the box for the error, and mind the pending bulk-access request before raising the rate.

      # Every rule above reads nothing when the samples stop, so their silence needs its own alert.
      - alert: MetricsMissing
        expr: absent(up{job="aiscast"} == 1)
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: No aiscast metrics for 10 minutes
          description: Alloy cannot scrape aiscast or cannot reach Grafana Cloud. Check systemctl status alloy aiscast on the box.
