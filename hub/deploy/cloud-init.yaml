#cloud-config
package_update: true
packages: [curl, unattended-upgrades, fail2ban]
users:
  - name: hub
    system: true
    shell: /usr/sbin/nologin
write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      MaxStartups 50:30:200
      PerSourceMaxStartups 3
      LoginGraceTime 20
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      maxretry = 3
      findtime = 10m
      bantime = 1h
  - path: /etc/hub.env
    permissions: "0600"
    content: |
      ADDR=:8080
      UDP_ADDR=:10110
      ARCHIVE_DIR=/var/lib/hub/archive
      SNAPSHOT=/var/lib/hub/vessels.json
      ISSUER_PUBKEYS=__ISSUER_PUBKEYS__
      PERSONAL_ISSUER_KEY=__PERSONAL_ISSUER_KEY__
  - path: /etc/systemd/system/hub.service
    content: |
      # /etc/systemd/system/hub.service — one hub per box. Binary at /opt/hub/hub, env in /etc/hub.env
      # (ADDR, UDP_ADDR, ARCHIVE_DIR, SNAPSHOT, R2_BUCKET, V0_API_KEYS, FEEDER_KEYS; never ALLOW_ANON).
      [Unit]
      Description=AIS hub
      After=network-online.target
      Wants=network-online.target
      
      [Service]
      User=hub
      Group=hub
      EnvironmentFile=/etc/hub.env
      WorkingDirectory=/var/lib/hub
      ExecStart=/opt/hub/hub
      Restart=always
      RestartSec=2
      # SIGTERM: snapshot + flush/upload open archive hours; give it time
      KillSignal=SIGTERM
      TimeoutStopSec=120
      LimitNOFILE=65536
      NoNewPrivileges=true
      ProtectSystem=strict
      ReadWritePaths=/var/lib/hub
      
      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl reload ssh
  - systemctl enable --now fail2ban
  - mkdir -p /opt/hub /var/lib/hub/archive
  - chown -R hub:hub /var/lib/hub
  - systemctl daemon-reload
  - systemctl enable hub
