<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AIS viewer</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous" />
<style>
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; }
  #map { position: fixed; inset: 0; }
  #stats { position: fixed; top: 8px; left: 8px; background: #fffd; padding: 6px 10px; border-radius: 4px; box-shadow: 0 1px 4px #0003; }
  #stats b { display: inline-block; min-width: 4.5em; }
  .maplibregl-popup-content { font: 12px/1.5 system-ui, sans-serif; max-width: 24em; }
  .maplibregl-popup-content h3 { margin: 0 0 4px; font-size: 14px; }
  .maplibregl-popup-content table td { padding: 0 6px 0 0; vertical-align: top; }
</style>
<div id="map"></div>
<div id="stats"></div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
<script>
  const params = new URLSearchParams(location.search);
  let server = params.get("server") || (location.hostname === "localhost" || location.hostname === "127.0.0.1" ? "localhost:8080" : "ais.openwaters.io");
  if (!server.includes("://")) server = (location.protocol === "https:" ? "https://" : "http://") + server;
  const station = params.get("station"); // ?station=<id>: highlight that station's vessels and show its stats
  const REFRESH = 15e3; // tiles are snapshots of the cache, rebuilt at most every 10 s

  const NAV = ["Under way using engine", "At anchor", "Not under command", "Restricted manoeuvrability", "Constrained by draught", "Moored", "Aground", "Fishing", "Under way sailing", "HSC", "WIG", "", "", "", "AIS-SART", ""];
  const CLASS_COLORS = { cargo: "#2e7d32", tanker: "#c62828", passenger: "#1565c0", fishing: "#ef6c00", pleasure: "#8e24aa", special: "#00838f", aton: "#6d4c41", base: "#37474f", sar: "#d81b60", other: "#616161" };

  // The ship class as a style expression over the tile's kind and type, so the map colours vessels itself.
  const type = ["coalesce", ["get", "type"], 0];
  const between = (lo, hi) => ["all", [">=", type, lo], ["<=", type, hi]];
  const shipClass = ["case",
    ["!=", ["get", "kind"], "vessel"], ["get", "kind"],
    ["==", type, 30], "fishing",
    ["any", ["==", type, 36], ["==", type, 37]], "pleasure",
    between(50, 59), "special",
    between(60, 69), "passenger",
    between(70, 79), "cargo",
    between(80, 89), "tanker",
    "other"];
  const color = ["match", shipClass, ...Object.entries(CLASS_COLORS).flat(), "#616161"];
  const faded = ["step", ["get", "age_s"], 1, 600, 0.7, 3600, 0.45, 86400, 0.25]; // live, this hour, today, this week
  const opacity = station ? ["*", faded, ["case", ["==", ["get", "station"], station], 1, 0.15]] : faded;

  const map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/positron",
    center: [10.6, 59.5],
    zoom: 8,
    hash: true,
  });
  map.addControl(new maplibregl.NavigationControl());
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // ---- stats: vessels in view, counted from the loaded tiles once the map settles ----
  function renderStats() {
    const ids = new Set(map.querySourceFeatures("ais", { sourceLayer: "vessels" }).map((f) => f.id));
    document.getElementById("stats").innerHTML = `<b>${ids.size}</b> in view` + stationHTML;
  }

  // ---- station view: GET /v1/stations/{id}, refreshed every 30 s; its vessels stay bright, everyone else fades ----
  let stationHTML = "";
  async function refreshStation() {
    if (!station) return;
    try {
      const res = await fetch(`${server}/v1/stations/${encodeURIComponent(station)}`);
      if (!res.ok) { stationHTML = `<br><b>station</b> ${esc(station)}: not heard yet`; return; }
      const { station: st } = await res.json();
      const age = st.last_age_s < 90 ? `${st.last_age_s}s ago` : `${Math.round(st.last_age_s / 60)} min ago`;
      const span = st.bbox ? `${(st.bbox[2] - st.bbox[0]).toFixed(2)}° × ${(st.bbox[3] - st.bbox[1]).toFixed(2)}°` : "no positions";
      stationHTML = `<br><b>station</b> ${esc(station)}<br><b>${st.vessels}</b> vessels (30 min), ${st.events.last_24h} msgs (24 h), ${st.duplicates} heard elsewhere first<br><b>last</b> ${age}; span ${span}`;
      if (st.bbox && !map._stationFitted) { map._stationFitted = true; map.fitBounds([[st.bbox[1], st.bbox[0]], [st.bbox[3], st.bbox[2]]], { padding: 40, maxZoom: 11 }); }
    } catch (e) { console.warn("station failed", e); }
    renderStats();
  }
  refreshStation();
  setInterval(refreshStation, 30e3);

  function triangle() {
    const s = 24, c = document.createElement("canvas");
    c.width = c.height = s;
    const g = c.getContext("2d");
    g.beginPath(); g.moveTo(s / 2, 1); g.lineTo(s - 3, s - 2); g.lineTo(s / 2, s * 0.7); g.lineTo(3, s - 2); g.closePath();
    g.fillStyle = "#000"; g.fill();
    return g.getImageData(0, 0, s, s);
  }

  map.on("load", () => {
    map.addImage("ship", triangle(), { sdf: true });
    // TileJSON brings the tile URL, zoom range, and the attribution every source requires.
    map.addSource("ais", { type: "vector", url: `${server}/v1/vessels/tiles.json` });
    map.addLayer({
      id: "ais-still", type: "circle", source: "ais", "source-layer": "vessels", filter: ["!", ["has", "hdg"]],
      paint: { "circle-radius": 4, "circle-color": color, "circle-opacity": opacity, "circle-stroke-width": 1, "circle-stroke-color": "#fff" },
    });
    map.addLayer({
      id: "ais-moving", type: "symbol", source: "ais", "source-layer": "vessels", filter: ["has", "hdg"],
      layout: { "icon-image": "ship", "icon-size": 0.7, "icon-rotate": ["get", "hdg"], "icon-rotation-alignment": "map", "icon-allow-overlap": true, "icon-ignore-placement": true },
      paint: { "icon-color": color, "icon-opacity": opacity, "icon-halo-color": "#fff", "icon-halo-width": 1 },
    });
    map.addLayer({
      id: "ais-label", type: "symbol", source: "ais", "source-layer": "vessels", minzoom: 11,
      layout: { "text-field": ["coalesce", ["get", "name"], ""], "text-size": 11, "text-offset": [0, 1.2], "text-anchor": "top", "text-optional": true },
      paint: { "text-halo-color": "#fff", "text-halo-width": 1.5, "text-opacity": opacity },
    });
    for (const layer of ["ais-still", "ais-moving"]) {
      map.on("mouseenter", layer, () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", layer, () => (map.getCanvas().style.cursor = ""));
      map.on("click", layer, (e) => popup(e.features[0].properties.mmsi, e.lngLat));
    }
    setInterval(() => map.refreshTiles("ais"), REFRESH);
  });
  map.on("idle", renderStats);

  // The tile holds what the map draws; the popup asks for the vessel's full state.
  async function popup(mmsi, lngLat) {
    const p = new maplibregl.Popup().setLngLat(lngLat).setHTML(`<h3>${mmsi}</h3>`).addTo(map);
    const res = await fetch(`${server}/v1/vessels/${mmsi}`);
    if (!res.ok) return;
    const f = await res.json(), v = f.properties, [lon, lat] = f.geometry?.coordinates || [];
    const row = (k, val) => (val == null || val === "" ? "" : `<tr><td>${k}</td><td>${val}</td></tr>`);
    p.setHTML(`<h3>${esc(v.name || mmsi)}</h3><table>
      ${row("MMSI", mmsi)}
      ${row("Type", v.type)}
      ${row("SOG", v.sog != null ? v.sog.toFixed(1) + " kn" : null)}
      ${row("COG", v.cog != null ? v.cog.toFixed(1) + "°" : null)}
      ${row("HDG", v.heading != null ? v.heading + "°" : null)}
      ${row("Status", v.nav_status != null ? esc(NAV[v.nav_status] || v.nav_status) : null)}
      ${row("Destination", v.destination && esc(v.destination))}
      ${row("Position", lat != null ? `${lat.toFixed(5)}, ${lon.toFixed(5)}` : null)}
      ${row("Seen", v.seen.replace("T", " "))}
      ${row("Source", esc(v.source) + (v.station && v.station !== v.source ? ` / ${esc(v.station)}` : ""))}
      ${row("Last", esc(v.msg_type))}
    </table>`);
  }
</script>
